name: Bug report
description: Something is wrong with the proxy or the telemetry it emits
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please report it privately instead: see SECURITY.md."
  - type: input
    id: version
    attributes: {label: mcp-exporter version, placeholder: "v0.1.0 or commit sha"}
    validations: {required: true}
  - type: dropdown
    id: mode
    attributes: {label: Mode, options: [stdio, http]}
    validations: {required: true}
  - type: input
    id: server
    attributes: {label: MCP server and client, placeholder: "e.g. server-github 2025.4 with Claude Desktop"}
  - type: textarea
    id: what
    attributes: {label: "What happened, and what did you expect?"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command line, relevant OTEL_* env vars, and a JSON-RPC frame if you have one. Redact secrets.
      render: shell
  - type: textarea
    id: logs
    attributes: {label: Exporter stderr output, render: text}
