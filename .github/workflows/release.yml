name: release
on:
  push: {tags: ["v*"]}
permissions: {contents: read}
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      packages: write   # ghcr.io image and chart
      id-token: write   # keyless cosign signing, attestations
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: azure/setup-helm@v5

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          section() { awk -v v="$1" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on && !/^\[[^]]*\]: /' CHANGELOG.md; }
          section "$v" > "$RUNNER_TEMP/notes.md"
          case "$v" in *-*) # pre-release: notes from Unreleased, which may be empty
            [ -s "$RUNNER_TEMP/notes.md" ] || section Unreleased > "$RUNNER_TEMP/notes.md"
            grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || echo "Release candidate for $v; see the commits since the last release." > "$RUNNER_TEMP/notes.md" ;;
          esac
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $v"; exit 1; }

      - uses: goreleaser/goreleaser-action@v7
        with: {args: "release --clean --release-notes ${{ runner.temp }}/notes.md"}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

      - name: Provenance for the release archives
        uses: actions/attest-build-provenance@v4
        with: {subject-checksums: dist/checksums.txt}

      - name: Image digest
        id: image
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/mcp-exporter:${GITHUB_REF_NAME#v}"
          echo "digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - name: Provenance for the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mcp-exporter
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Push and sign Helm chart
        id: chart
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/mcp-exporter --version "$v" --app-version "$v" -d "$RUNNER_TEMP"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "$RUNNER_TEMP/mcp-exporter-$v.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' "$RUNNER_TEMP/push.log" | head -1)
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/mcp-exporter@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Provenance for the chart
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/mcp-exporter
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
