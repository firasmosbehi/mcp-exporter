name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml gates on the full CI
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz (short; crashers land in testdata/fuzz as regression seeds)
        run: |
          for t in jsonrpc:FuzzParse proxy:FuzzSSEObserver proxy:FuzzGunzip observe:FuzzFrame; do
            go test ./internal/${t%%:*} -run '^$' -fuzz "^${t#*:}\$" -fuzztime 20s
          done
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/mcp-exporter
  windows:
    # stdio mode refuses console exporters here (no fd-level stdout swap); keep that tested.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go test ./...
  e2e:
    # Real MCP server -> mcp-exporter -> Prometheus/Tempo/Loki, with assertions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/compose/smoke.sh
        # KEEP: containers stay up so the failure step can show their logs.
        # PROFILES: also check pprof + eBPF profiles reach Pyroscope (Alpha protocol, so it can break on bumps).
        env: {KEEP: "1", PROFILES: "1"}
      - if: failure()
        run: docker compose -p mcp-smoke -f deploy/compose/docker-compose.yaml -f deploy/compose/profiling.yaml logs --tail 100 || true
