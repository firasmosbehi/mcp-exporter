name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml gates on the full CI
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz (short; crashers land in testdata/fuzz as regression seeds)
        run: |
          for t in jsonrpc:FuzzParse jsonrpc:FuzzIDKey proxy:FuzzSSEObserver proxy:FuzzGunzip observe:FuzzFrame; do
            go test ./internal/${t%%:*} -run '^$' -fuzz "^${t#*:}\$" -fuzztime 20s
          done
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/mcp-exporter
  windows:
    # No fd-level stdout swap here: the stderr console exporters alone must keep stdio clean.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go test ./...
  helm:
    # The chart in a real cluster: Ready via /readyz, an MCP session through the Service, span, metrics and pprof ports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with: {cluster_name: mcp-e2e}
      - run: docker build -t mcp-exporter:e2e . && kind load docker-image mcp-exporter:e2e --name mcp-e2e
      - run: deploy/helm/e2e.sh
      - if: failure()
        run: kubectl -n mcp-e2e describe pods; kubectl -n mcp-e2e get events
  e2e:
    # Real MCP server -> mcp-exporter -> Prometheus/Tempo/Loki, with assertions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/compose/smoke.sh
        # KEEP: containers stay up so the failure step can show their logs.
        # PROFILES: also check pprof + eBPF profiles reach Pyroscope (Alpha protocol, so it can break on bumps).
        env: {KEEP: "1", PROFILES: "1"}
      - if: failure()
        run: docker compose -p mcp-smoke -f deploy/compose/docker-compose.yaml -f deploy/compose/profiling.yaml logs --tail 100 || true
