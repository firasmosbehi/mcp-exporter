apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: mcp, port: {{ .Values.service.port }}, targetPort: mcp}
    {{- if .Values.exporter.prometheus.enabled }}
    - {name: metrics, port: {{ .Values.exporter.prometheus.port }}, targetPort: metrics}
    {{- end }}
