version: 2
builds:
  - main: ./cmd/mcp-exporter
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w, "-X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides: [{goos: windows, formats: [zip]}]
checksum: {name_template: checksums.txt}
release:
  prerelease: auto # v1.2.3-rc1 etc. become GitHub pre-releases
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: [sign-blob, "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}", --yes]
dockers_v2:
  - images: ["ghcr.io/firasmosbehi/mcp-exporter"]
    tags: ["{{ .Version }}", "{{ if not .Prerelease }}latest{{ end }}"] # rcs never move latest
    dockerfile: release.Dockerfile
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/firasmosbehi/mcp-exporter
      org.opencontainers.image.description: OpenTelemetry traces, metrics and logs for MCP servers
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
docker_signs:
  - artifacts: manifests
    args: [sign, "${artifact}", --yes]
